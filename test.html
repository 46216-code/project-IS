<html>
<!-- Include Tailwind via CDN if testing directly in an HTML file -->
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <!-- Horizontal Hold Button -->
  <button id="hold-btn" class="relative flex items-center justify-between w-80 h-14 px-5 bg-slate-800 text-white font-medium rounded-xl overflow-hidden shadow-lg border border-slate-700 select-none cursor-pointer active:scale-95 transition-transform">
    <!-- Progress fill: Custom cubic-bezier easing -->
    <div id="progress-fill" class="absolute inset-0 bg-blue-600 origin-left scale-x-0 transition-transform ease-[cubic-bezier(.3,.59,.24,.95)] duration-0"></div>
    <!-- Text & icon overlay -->
    <div class="relative z-10 flex items-center justify-between w-full">
      <span class="flex items-center gap-3">
        <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        <span class="font-semibold text-sm">Hold to confirm</span>
      </span>
      <span id="btn-status" class="text-xs uppercase tracking-wider text-slate-400 font-bold">2s</span>
    </div>
  </button>

  <!-- Centered Toast Notification -->
  <div id="toast" class="fixed mt-[95vh] left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center gap-3 bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl border border-slate-700 opacity-0 scale-90 pointer-events-none transition-all duration-300 z-50">
    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span class="text-base font-medium">Action completed successfully!</span>
  </div>
  </div>

<script>
  const btn = document.getElementById('hold-btn');
const fill = document.getElementById('progress-fill');
const toast = document.getElementById('toast');
const statusText = document.getElementById('btn-status');

let holdTimer = null;
let toastTimer = null;

function startHold() {
  // Apply 2-second duration (2000ms)
  fill.classList.remove('duration-0');
  fill.classList.add('duration-[2000ms]', 'scale-x-100');
  statusText.textContent = 'Holding...';

  holdTimer = setTimeout(() => {
    showToast();
    resetHold();
  }, 2000);
}

function resetHold() {
  if (holdTimer) {
    clearTimeout(holdTimer);
    holdTimer = null;
  }
  
  // Instant reset on release
  fill.classList.remove('duration-[2000ms]', 'scale-x-100');
  fill.classList.add('duration-0');
  statusText.textContent = '2s';
}

function showToast() {
  if (toastTimer) clearTimeout(toastTimer);

  toast.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
  toast.classList.add('opacity-100', 'scale-100');

  // Keep toast visible for 3 seconds after completion
  toastTimer = setTimeout(() => {
    toast.classList.remove('opacity-100', 'scale-100');
    toast.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
  }, 5000);
}

// Mouse events
btn.addEventListener('mousedown', startHold);
btn.addEventListener('mouseup', resetHold);
btn.addEventListener('mouseleave', resetHold);

// Touch events for mobile
btn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startHold();
});
btn.addEventListener('touchend', resetHold);
btn.addEventListener('touchcancel', resetHold);
</script>
</html>
